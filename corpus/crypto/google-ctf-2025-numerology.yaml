id: google-ctf-2025-numerology
title: Numerology
event: Google CTF 2025 Qualifiers
category: crypto
sourceUrl: https://github.com/google/google-ctf/tree/main/2025/quals/crypto-numerology
author: Google CTF
inputFormats:
  - original JSON challenge package with a known key, 1024 learning pairs, and a target ciphertext
steps:
  - operationId: crypto.chacha.qr1-prefix-recover
    originalTool: Python reference cipher and 32-bit quarter-round inversion
    originalCommand: assume a four-byte CTF{ prefix, invert the first output word to recover the counter, and decrypt the first 42 bytes with the known key and zero constants
    inputs:
      - ctf_challenge_package.json from the official attachments directory
      - assumed plaintext prefix CTF{
    outputs:
      - counter 32279
      - 42 candidate plaintext bytes
    workbenchCondition: The operation marks the output unverified because the prefix is assumed; the fixture regression independently compares every candidate byte with the archived challenge flag.
verification:
  pattern: '^CTF\{w3_aRe_g0Nn@_ge7_MY_FuncKee_monkey_!!\}$'
  intermediate:
    - Published sample_n0_c0 recovers counter 1 and reproduces its 48 known plaintext bytes.
    - The 42-byte target is within the first 48 bytes, where this one-quarter-round zero-constant variant does not depend on the unknown nonce.
    - The prefix-derived target counter is 32279, and the complete candidate matches the archived flag byte-for-byte.
fixture:
  usable: true
  inputs:
    - src/formats/testing/google-ctf-2025-numerology.json
  test: src/formats/oneQuarterRound.test.ts
