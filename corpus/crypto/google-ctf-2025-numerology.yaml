  licenseFile: corpus/LICENSE.google-ctf.apache-2.0.txt
  attribution: Copyright 2025 Google LLC; original Numerology player attachment and archived challenge flag.
  provenance: The JSON is byte-identical to the official 484368-byte attachment (SHA-256 c088a9227cff73fa9f41d5e010fc691ee796d45113546f885665312d71197ed7). The expected flag comes from the challenge's published flag.txt; no secret nonce is inferred.